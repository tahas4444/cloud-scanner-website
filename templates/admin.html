<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Upload</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans">
  <div class="max-w-md mx-auto py-16 px-4">
    <h2 class="text-2xl font-semibold mb-6">🔒 Upload New Version</h2>
    <form method="POST" enctype="multipart/form-data" class="space-y-4">
      <input type="password" name="password" placeholder="Admin password" class="w-full p-2 rounded bg-gray-800 border border-gray-700" required />
      <input type="file" name="file" class="w-full text-white" required />
      <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 py-2 rounded">Upload</button>
    </form>
  </div>
</body>
</html>
